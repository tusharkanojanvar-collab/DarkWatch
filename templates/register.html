<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkWatch | Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-logo">D</div>

        <h1>DARKWATCH</h1>
        <p class="auth-subtitle">THREAT INTELLIGENCE SYSTEM</p>

        <h2>Create Account</h2>
        <p class="auth-description">Register to access DarkWatch.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="auth-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <label>Username</label>
            <input type="text" name="username" placeholder="Choose username" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter email" required>

            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" id="registerPassword" name="password" placeholder="Create password" required>
                <button type="button" class="eye-btn" onclick="togglePassword('registerPassword', this)">👁</button>
            </div>

            <label>Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm password" required>
                <button type="button" class="eye-btn" onclick="togglePassword('confirmPassword', this)">👁</button>
            </div>

            <button type="submit">CREATE ACCOUNT</button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

        <div class="auth-security">● SECURE REGISTRATION</div>

    </div>

    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈";
            } else {
                input.type = "password";
                button.textContent = "👁";
            }
        }
    </script>

</body>
</html>
